name: Central DevSecOps - SaaS Interno

on:
  workflow_call:
    inputs:
      project_name:
        description: 'Nome do projeto (usado no DefectDojo)'
        required: true
        type: string
      stack_type:
        description: 'Stack do projeto (node, dotnet, python, java, cpp, go, rust)'
        required: true
        type: string
      run_dast:
        description: 'Executar análise dinâmica (DAST) com OWASP ZAP'
        required: false
        type: boolean
        default: false
      dast_target_url:
        description: 'URL alvo para o scan DAST (ex: http://localhost:3000 ou https://staging.exemplo.com)'
        required: false
        type: string
    secrets:
      DEFECTDOJO_URL:
        description: 'URL do DefectDojo'
        required: true
      DEFECTDOJO_API_KEY:
        description: 'Token de API do DefectDojo'
        required: true

  workflow_dispatch:
    inputs:
      project_name:
        description: 'Nome do projeto (usado no DefectDojo)'
        required: true
        type: string
        default: 'Teste_da_Esteira'
      stack_type:
        description: 'Stack do projeto (node, dotnet, python, java, cpp, go, rust)'
        required: true
        type: choice
        options:
          - node
          - dotnet
          - python
          - java
          - cpp
          - go
          - rust
        default: 'node'
      run_dast:
        description: 'Executar análise dinâmica (DAST) com OWASP ZAP'
        required: false
        type: boolean
        default: false
      dast_target_url:
        description: 'URL alvo para o scan DAST'
        required: false
        type: string

jobs:
  devsecops-pipeline:
    name: DevSecOps Scans & Quality Gates
    runs-on: ubuntu-latest
    env:
      INPUT_PROJECT_NAME: ${{ inputs.project_name || 'Teste_da_Esteira' }}
      INPUT_STACK_TYPE: ${{ inputs.stack_type || 'node' }}
      INPUT_RUN_DAST: ${{ inputs.run_dast || false }}
      INPUT_DAST_TARGET_URL: ${{ inputs.dast_target_url || '' }}
    steps:
      - name: Checkout App Code (Código do Desenvolvedor)
        uses: actions/checkout@v4
        with:
          path: app-code

      - name: Checkout Security Tools (Central DevSecOps)
        uses: actions/checkout@v4
        with:
          repository: joaohenrique11z/teste_esteira
          path: security-tools

      - name: Create Reports Directories
        run: |
          mkdir -p reports/gitleaks reports/semgrep reports/trivy reports/zap

      - name: Preparar ambiente Node.js
        if: env.INPUT_STACK_TYPE == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Instalar dependências Node.js
        if: env.INPUT_STACK_TYPE == 'node'
        working-directory: app-code
        run: npm install || npm ci

      - name: Preparar ambiente .NET
        if: env.INPUT_STACK_TYPE == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Instalar dependências .NET
        if: env.INPUT_STACK_TYPE == 'dotnet'
        working-directory: app-code
        run: dotnet restore

      - name: Preparar ambiente Python
        if: env.INPUT_STACK_TYPE == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Instalar dependências Python
        if: env.INPUT_STACK_TYPE == 'python'
        working-directory: app-code
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Setup Java (Maven/Gradle)
        if: env.INPUT_STACK_TYPE == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install Java Dependencies
        if: env.INPUT_STACK_TYPE == 'java'
        run: |
          if [ -f "pom.xml" ]; then
            mvn clean install -DskipTests || true
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            ./gradlew build -x test || true
          fi
        working-directory: app-code

      - name: Preparar ambiente C/C++
        if: env.INPUT_STACK_TYPE == 'cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Compilar projeto C/C++
        if: env.INPUT_STACK_TYPE == 'cpp'
        working-directory: app-code
        run: |
          if [ -f "CMakeLists.txt" ]; then
            mkdir -p build && cd build && cmake .. && make || true
          elif [ -f "Makefile" ]; then
            make || true
          fi

      - name: Preparar ambiente Go
        if: env.INPUT_STACK_TYPE == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Instalar dependências Go
        if: env.INPUT_STACK_TYPE == 'go'
        working-directory: app-code
        run: |
          if [ -f go.mod ]; then go mod download; fi

      - name: Preparar ambiente Rust
        if: env.INPUT_STACK_TYPE == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências Rust
        if: env.INPUT_STACK_TYPE == 'rust'
        working-directory: app-code
        run: |
          if [ -f Cargo.toml ]; then cargo fetch || true; fi

      - name: Executar Gitleaks (Shadow Mode)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/app-code:/code \
            -v ${{ github.workspace }}/security-tools/security/gitleaks:/config \
            -v ${{ github.workspace }}/reports/gitleaks:/reports \
            ghcr.io/gitleaks/gitleaks:latest detect \
            --source=/code \
            --config=/config/.gitleaks.toml \
            --report-format=json \
            --report-path=/reports/gitleaks-results.json \
            --redact || true

      - name: Executar Semgrep (Shadow Mode)
        run: |
          mkdir -p reports/semgrep
          SEMGREP_CONFIGS="--config p/owasp-top-ten --config /config/rules.yaml"
          STACK="${{ env.INPUT_STACK_TYPE }}"
          if [ "$STACK" = "node" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/nodejs"
          elif [ "$STACK" = "python" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/python"
          elif [ "$STACK" = "java" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/java"
          elif [ "$STACK" = "dotnet" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/csharp"
          elif [ "$STACK" = "cpp" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/c"
          elif [ "$STACK" = "go" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/golang"
          elif [ "$STACK" = "rust" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/rust"
          fi
          docker run --rm \
            -v ${{ github.workspace }}/app-code:/src \
            -v ${{ github.workspace }}/security-tools/security/semgrep:/config \
            -v ${{ github.workspace }}/reports/semgrep:/reports \
            semgrep/semgrep semgrep scan \
            $SEMGREP_CONFIGS \
            --json \
            --output=/reports/semgrep-results.json \
            /src || true

      - name: Executar Trivy FS (Shadow Mode)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'app-code'
          format: 'json'
          output: 'reports/trivy/trivy-fs-results.json'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      - name: ZAP DAST (Shadow Mode)
        if: env.INPUT_RUN_DAST == 'true' && env.INPUT_DAST_TARGET_URL != ''
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ env.INPUT_DAST_TARGET_URL }}
          fail_action: false

      - name: Mover relatórios ZAP
        if: env.INPUT_RUN_DAST == 'true' && env.INPUT_DAST_TARGET_URL != ''
        run: |
          mv report_json.json reports/zap/ 2>/dev/null || true

      - name: Upload Relatórios
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devsecops-reports
          path: reports/
