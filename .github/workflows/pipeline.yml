name: Central DevSecOps - SaaS Interno

on:
  workflow_call:
    inputs:
      project_name:
        description: 'Nome do projeto (usado no DefectDojo)'
        required: true
        type: string
      stack_type:
        description: 'Stack do projeto (node, python, java, go, rust, cpp, php, ruby, dotnet, flutter)'
        required: true
        type: string
      working_directory:
        description: 'Subdiretório do projeto dentro do repositório (ex: photo-studio/). Default: raiz.'
        required: false
        type: string
        default: '.'
      run_dast:
        description: 'Executar análise dinâmica (DAST) com OWASP ZAP'
        required: false
        type: boolean
        default: false
      dast_target_url:
        description: 'URL alvo para o scan DAST (ex: http://localhost:3000 ou https://staging.exemplo.com)'
        required: false
        type: string
    secrets:
      DEFECTDOJO_URL:
        description: 'URL do DefectDojo'
        required: true
      DEFECTDOJO_API_KEY:
        description: 'Token de API do DefectDojo'
        required: true

  workflow_dispatch:
    inputs:
      project_name:
        description: 'Nome do projeto (usado no DefectDojo)'
        required: true
        type: string
        default: 'Teste_da_Esteira'
      stack_type:
        description: 'Stack do projeto (node, python, java, go, rust, cpp, php, ruby, dotnet, flutter)'
        required: true
        type: choice
        options:
          - node
          - python
          - java
          - go
          - rust
          - cpp
          - php
          - ruby
          - dotnet
          - flutter
        default: 'node'
      working_directory:
        description: 'Subdiretório do projeto dentro do repositório (ex: photo-studio/). Default: raiz.'
        required: false
        type: string
        default: '.'
      run_dast:
        description: 'Executar análise dinâmica (DAST) com OWASP ZAP'
        required: false
        type: boolean
        default: false
      dast_target_url:
        description: 'URL alvo para o scan DAST'
        required: false
        type: string

jobs:
  devsecops-pipeline:
    name: DevSecOps Scans & Quality Gates
    runs-on: ubuntu-latest
    env:
      INPUT_PROJECT_NAME: ${{ inputs.project_name || 'Teste_da_Esteira' }}
      INPUT_STACK_TYPE: ${{ inputs.stack_type || 'node' }}
      INPUT_WORKING_DIRECTORY: ${{ inputs.working_directory || '.' }}
      INPUT_RUN_DAST: ${{ inputs.run_dast || false }}
      INPUT_DAST_TARGET_URL: ${{ inputs.dast_target_url || '' }}
    steps:
      - name: Checkout App Code (Código do Desenvolvedor)
        uses: actions/checkout@v4
        with:
          path: app-code

      - name: Checkout Security Tools (Central DevSecOps)
        uses: actions/checkout@v4
        with:
          repository: joaohenrique11z/teste_esteira
          path: security-tools

      # ──────────────────────────────────────────────────────────────────────
      # Resolve o caminho real do projeto dentro do checkout app-code.
      # Repositórios que não passam working_directory recebem default "."
      # e continuam apontando para app-code — retrocompatibilidade total.
      # ──────────────────────────────────────────────────────────────────────
      - name: Resolve app path
        id: app-path
        run: |
          APP_PATH="app-code/${{ env.INPUT_WORKING_DIRECTORY }}"
          # Remove trailing slash redundante para evitar duplo // nos steps
          APP_PATH="${APP_PATH%/}"
          echo "path=${APP_PATH}" >> "$GITHUB_OUTPUT"

      # ──────────────────────────────────────────────────────────────────────
      # Detecta o toolchain correto inspecionando lockfiles / manifests
      # dentro do diretório do projeto (pode ser subdiretório).
      # Expõe install_cmd para uso no step "Install dependencies".
      # ──────────────────────────────────────────────────────────────────────
      - name: Detect build toolchain
        id: toolchain
        working-directory: ${{ steps.app-path.outputs.path }}
        run: |
          STACK="${{ env.INPUT_STACK_TYPE }}"
          install_cmd=""

          case "$STACK" in
            node)
              if [ -f "pnpm-lock.yaml" ]; then
                install_cmd="pnpm install --frozen-lockfile"
              elif [ -f "yarn.lock" ]; then
                install_cmd="yarn install --frozen-lockfile"
              elif [ -f "package-lock.json" ]; then
                install_cmd="npm ci"
              elif [ -f "package.json" ]; then
                install_cmd="npm install"
              fi
              ;;
            python)
              if [ -f "poetry.lock" ]; then
                install_cmd="poetry install"
              elif [ -f "requirements.txt" ]; then
                install_cmd="pip install -r requirements.txt"
              fi
              ;;
            java)
              if [ -f "pom.xml" ]; then
                install_cmd="mvn -B install -DskipTests"
              elif ls build.gradle* >/dev/null 2>&1; then
                install_cmd="./gradlew build -x test"
              fi
              ;;
            go)
              if [ -f "go.mod" ]; then
                install_cmd="go mod download"
              fi
              ;;
            rust)
              if [ -f "Cargo.toml" ]; then
                install_cmd="cargo fetch"
              fi
              ;;
            cpp)
              if [ -f "CMakeLists.txt" ]; then
                install_cmd="cmake -S . -B build"
              elif [ -f "Makefile" ]; then
                install_cmd="make"
              fi
              ;;
            php)
              if [ -f "composer.lock" ]; then
                install_cmd="composer install --no-interaction --prefer-dist"
              fi
              ;;
            ruby)
              if [ -f "Gemfile.lock" ]; then
                install_cmd="bundle install"
              fi
              ;;
            dotnet)
              if ls *.csproj >/dev/null 2>&1 || ls *.sln >/dev/null 2>&1; then
                install_cmd="dotnet restore"
              fi
              ;;
            flutter)
              if [ -f "pubspec.lock" ]; then
                install_cmd="flutter pub get"
              fi
              ;;
          esac

          echo "install_cmd=${install_cmd}" >> "$GITHUB_OUTPUT"
          echo "Toolchain detectado: stack=${STACK}, cmd=${install_cmd}"

      # ──────────────────────────────────────────────────────────────────────
      # Setups de ambiente (apenas configuração do runner, sem instalar deps)
      # ──────────────────────────────────────────────────────────────────────
      - name: Preparar ambiente Node.js
        if: env.INPUT_STACK_TYPE == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (for pnpm/yarn)
        if: >-
          env.INPUT_STACK_TYPE == 'node' &&
          (contains(steps.toolchain.outputs.install_cmd, 'pnpm') ||
           contains(steps.toolchain.outputs.install_cmd, 'yarn'))
        run: corepack enable

      - name: Preparar ambiente .NET
        if: env.INPUT_STACK_TYPE == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Preparar ambiente Python
        if: env.INPUT_STACK_TYPE == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java (Maven/Gradle)
        if: env.INPUT_STACK_TYPE == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar ambiente C/C++
        if: env.INPUT_STACK_TYPE == 'cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Preparar ambiente Go
        if: env.INPUT_STACK_TYPE == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Preparar ambiente Rust
        if: env.INPUT_STACK_TYPE == 'rust'
        uses: dtolnay/rust-toolchain@stable

      # ──────────────────────────────────────────────────────────────────────
      # Step unificado de instalação de dependências.
      # Usa o comando detectado pelo toolchain e o diretório resolvido.
      # Se install_cmd estiver vazio (stack não reconhecida ou sem lockfile),
      # o step é pulado silenciosamente.
      # ──────────────────────────────────────────────────────────────────────
      - name: Install dependencies
        if: steps.toolchain.outputs.install_cmd != ''
        working-directory: ${{ steps.app-path.outputs.path }}
        run: ${{ steps.toolchain.outputs.install_cmd }}

      # ──────────────────────────────────────────────────────────────────────
      # Security Scans — Shadow Mode (continue-on-error implícito via || true)
      # ──────────────────────────────────────────────────────────────────────
      - name: Create Reports Directories
        run: |
          mkdir -p reports/gitleaks reports/semgrep reports/trivy reports/zap

      - name: Executar Gitleaks (Shadow Mode)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/app-code:/code \
            -v ${{ github.workspace }}/security-tools/security/gitleaks:/config \
            -v ${{ github.workspace }}/reports/gitleaks:/reports \
            ghcr.io/gitleaks/gitleaks:latest detect \
            --source=/code \
            --config=/config/.gitleaks.toml \
            --report-format=json \
            --report-path=/reports/gitleaks-results.json \
            --redact || true

      - name: Executar Semgrep (Shadow Mode)
        run: |
          mkdir -p reports/semgrep
          SEMGREP_CONFIGS="--config p/owasp-top-ten --config /config/rules.yaml"
          STACK="${{ env.INPUT_STACK_TYPE }}"
          if [ "$STACK" = "node" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/nodejs"
          elif [ "$STACK" = "python" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/python"
          elif [ "$STACK" = "java" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/java"
          elif [ "$STACK" = "dotnet" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/csharp"
          elif [ "$STACK" = "cpp" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/c"
          elif [ "$STACK" = "go" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/golang"
          elif [ "$STACK" = "rust" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/rust"
          elif [ "$STACK" = "php" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/php"
          elif [ "$STACK" = "ruby" ]; then
            SEMGREP_CONFIGS="$SEMGREP_CONFIGS --config p/ruby"
          fi
          docker run --rm \
            -v ${{ github.workspace }}/app-code:/src \
            -v ${{ github.workspace }}/security-tools/security/semgrep:/config \
            -v ${{ github.workspace }}/reports/semgrep:/reports \
            semgrep/semgrep semgrep scan \
            $SEMGREP_CONFIGS \
            --json \
            --output=/reports/semgrep-results.json \
            /src || true

      # Trivy FS aponta para o subdiretório do projeto para analisar
      # lockfiles e manifests corretos (ex: photo-studio/pnpm-lock.yaml).
      - name: Executar Trivy FS (Shadow Mode)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: ${{ steps.app-path.outputs.path }}
          format: 'json'
          output: 'reports/trivy/trivy-fs-results.json'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      - name: ZAP DAST (Shadow Mode)
        if: env.INPUT_RUN_DAST == 'true' && env.INPUT_DAST_TARGET_URL != ''
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ env.INPUT_DAST_TARGET_URL }}
          fail_action: false
          allow_issue_writing: false

      - name: Mover relatórios ZAP
        if: env.INPUT_RUN_DAST == 'true' && env.INPUT_DAST_TARGET_URL != ''
        run: |
          mv report_json.json reports/zap/ 2>/dev/null || true

      - name: Upload Relatórios
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devsecops-reports
          path: reports/

      # ──────────────────────────────────────────────────────────────────────
      # DefectDojo — Import de resultados
      # ──────────────────────────────────────────────────────────────────────

      - name: Import Semgrep results to DefectDojo
        if: always()
        run: |
          curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=Semgrep JSON Report" \
            -F "file=@reports/semgrep/semgrep-results.json" \
            -F "product_name=${{ env.INPUT_PROJECT_NAME }}" \
            -F "product_type_name=Esteira DevSecOps MouraTech" \
            -F "engagement_name=Automated CI/CD" \
            -F "auto_create_context=true" \
            -F "active=true" \
            -F "verified=true"

      - name: Import Gitleaks results to DefectDojo
        if: always()
        run: |
          curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=Gitleaks Scan" \
            -F "file=@reports/gitleaks/gitleaks-results.json" \
            -F "product_name=${{ env.INPUT_PROJECT_NAME }}" \
            -F "product_type_name=Esteira DevSecOps MouraTech" \
            -F "engagement_name=Automated CI/CD" \
            -F "auto_create_context=true" \
            -F "active=true" \
            -F "verified=true"

      - name: Import Trivy results to DefectDojo
        if: always()
        run: |
          curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=Trivy Scan" \
            -F "file=@reports/trivy/trivy-fs-results.json" \
            -F "product_name=${{ env.INPUT_PROJECT_NAME }}" \
            -F "product_type_name=Esteira DevSecOps MouraTech" \
            -F "engagement_name=Automated CI/CD" \
            -F "auto_create_context=true" \
            -F "active=true" \
            -F "verified=true"

      - name: Import ZAP results to DefectDojo
        if: env.INPUT_RUN_DAST == 'true' && env.INPUT_DAST_TARGET_URL != ''
        run: |
          curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=ZAP Scan" \
            -F "file=@reports/zap/report_json.json" \
            -F "product_name=${{ env.INPUT_PROJECT_NAME }}" \
            -F "product_type_name=Esteira DevSecOps MouraTech" \
            -F "engagement_name=Automated CI/CD" \
            -F "auto_create_context=true" \
            -F "active=true" \
            -F "verified=true"
