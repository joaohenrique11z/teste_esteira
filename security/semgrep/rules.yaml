# regras customizadas do semgrep
# foco em riscos comuns de segurança em aplicações node.js e express

rules:
  - id: nodejs-dangerous-code-execution
    pattern-either:
      - pattern: "eval(...)"
      - pattern: "new Function(...)"
    message: "uso de eval() ou new Function() detectado. esse tipo de execução dinâmica pode permitir injeção de código."
    languages:
      - javascript
      - typescript
    severity: ERROR
    metadata:
      owasp: "A03:2021 - Injection"
      cwe: "CWE-95"
      category: "code execution"

  - id: nodejs-weak-hash-md5-sha1
    pattern-either:
      - pattern: 'crypto.createHash("md5")'
      - pattern: 'crypto.createHash("sha1")'
      - pattern: "crypto.createHash('md5')"
      - pattern: "crypto.createHash('sha1')"
    message: "algoritmo de hash fraco detectado. para dados sensíveis, utilizar uma alternativa mais segura."
    languages:
      - javascript
      - typescript
    severity: ERROR
    metadata:
      owasp: "A02:2021 - Cryptographic Failures"
      cwe: "CWE-327"
      category: "cryptography"

  - id: nodejs-hardcoded-jwt-secret
    patterns:
      - pattern-either:
          - pattern: "jwt.sign($PAYLOAD, $SECRET, ...)"
          - pattern: "jwt.verify($TOKEN, $SECRET, ...)"
      - metavariable-regex:
          metavariable: $SECRET
          regex: '^[''"][^''"]{8,}[''"]$'
    message: "secret jwt escrito diretamente no código. utilizar variável de ambiente para armazenar esse valor."
    languages:
      - javascript
      - typescript
    severity: ERROR
    metadata:
      owasp: "A02:2021 - Cryptographic Failures"
      cwe: "CWE-798"
      category: "hardcoded secret"

  - id: nodejs-sql-string-concat
    pattern-either:
      - pattern: '$DB.query("..." + $INPUT)'
      - pattern: '$DB.execute("..." + $INPUT)'
      - pattern: |
          $DB.query(`...${$INPUT}...`)
      - pattern: |
          $DB.execute(`...${$INPUT}...`)
    message: "possível sql injection por concatenação de dados em query. utilizar parâmetros ou prepared statements."
    languages:
      - javascript
      - typescript
    severity: ERROR
    metadata:
      owasp: "A03:2021 - Injection"
      cwe: "CWE-89"
      category: "sql injection"

  - id: nodejs-sensitive-data-in-log
    pattern-either:
      - pattern: "console.log($X.password)"
      - pattern: "console.log($X.senha)"
      - pattern: "console.log($X.token)"
      - pattern: "console.log($X.jwt)"
      - pattern: "logger.info($X.password)"
      - pattern: "logger.info($X.senha)"
      - pattern: "logger.info($X.token)"
      - pattern: "logger.error($X.password)"
      - pattern: "logger.error($X.token)"
    message: "dado sensível sendo enviado para log. evitar registrar senha, token ou informações de autenticação."
    languages:
      - javascript
      - typescript
    severity: ERROR
    metadata:
      owasp: "A07:2021 - Identification and Authentication Failures"
      cwe: "CWE-532"
      category: "sensitive data exposure"

  - id: nodejs-cors-wildcard
    pattern-either:
      - pattern: 'cors({ origin: "*" })'
      - pattern: "cors({ origin: '*' })"
      - pattern: 'res.setHeader("Access-Control-Allow-Origin", "*")'
      - pattern: "res.setHeader('Access-Control-Allow-Origin', '*')"
    message: "cors liberado para qualquer origem. revisar se essa configuração é necessária."
    languages:
      - javascript
      - typescript
    severity: WARNING
    metadata:
      owasp: "A05:2021 - Security Misconfiguration"
      cwe: "CWE-942"
      category: "security misconfiguration"

  - id: nodejs-debug-enabled
    pattern-either:
      - pattern: 'app.set("env", "development")'
      - pattern: "app.set('env', 'development')"
    message: "configuração de debug ou desenvolvimento encontrada. verificar se isso não será usado em produção."
    languages:
      - javascript
      - typescript
    severity: WARNING
    metadata:
      owasp: "A05:2021 - Security Misconfiguration"
      category: "security misconfiguration"

  - id: express-api-route-without-auth
    patterns:
      - pattern-either:
          - pattern: "app.get($PATH, $HANDLER)"
          - pattern: "app.post($PATH, $HANDLER)"
          - pattern: "app.put($PATH, $HANDLER)"
          - pattern: "app.patch($PATH, $HANDLER)"
          - pattern: "app.delete($PATH, $HANDLER)"
      - pattern-not: "app.get($PATH, $AUTH, $HANDLER)"
      - pattern-not: "app.post($PATH, $AUTH, $HANDLER)"
      - pattern-not: "app.put($PATH, $AUTH, $HANDLER)"
      - pattern-not: "app.patch($PATH, $AUTH, $HANDLER)"
      - pattern-not: "app.delete($PATH, $AUTH, $HANDLER)"
      - metavariable-regex:
          metavariable: $PATH
          regex: '^[''"]/api/.*[''"]$'
    message: "rota de api sem middleware de autenticação visível. verificar se a rota realmente deve ser pública."
    languages:
      - javascript
      - typescript
    severity: WARNING
    metadata:
      owasp: "A01:2021 - Broken Access Control"
      cwe: "CWE-285"
      category: "access control"

  # ============================================================
  # regras customizadas para C/C++
  # foco em riscos comuns de segurança em aplicações C e C++
  # ============================================================

  - id: cpp-unsafe-string-functions
    pattern-either:
      - pattern: strcpy(...)
      - pattern: strcat(...)
      - pattern: sprintf(...)
      - pattern: gets(...)
    message: "uso de função insegura de manipulação de string/buffer detectado. essas funções não verificam o tamanho do destino e podem causar buffer overflow. utilizar alternativas seguras como strncpy, strncat, snprintf ou fgets."
    languages:
      - c
      - cpp
    severity: ERROR
    metadata:
      owasp: "A03:2021 - Injection"
      cwe: "CWE-676"
      category: "buffer overflow"

  - id: cpp-malloc-without-null-check
    patterns:
      - pattern: |
          $PTR = malloc(...);
          ...
          *$PTR;
      - pattern-not: |
          $PTR = malloc(...);
          ...
          if ($PTR == NULL) { ... }
          ...
          *$PTR;
      - pattern-not: |
          $PTR = malloc(...);
          ...
          if (!$PTR) { ... }
          ...
          *$PTR;
    message: "uso de malloc sem verificação de retorno NULL detectado. se a alocação falhar, o ponteiro será NULL e o acesso causará comportamento indefinido. sempre verificar o retorno de malloc antes de usar o ponteiro."
    languages:
      - c
      - cpp
    severity: WARNING
    metadata:
      owasp: "A06:2021 - Vulnerable and Outdated Components"
      cwe: "CWE-476"
      category: "null pointer dereference"

  - id: cpp-command-injection
    pattern-either:
      - pattern: system(...)
      - pattern: popen(...)
      - pattern: execl(...)
      - pattern: execlp(...)
      - pattern: execle(...)
      - pattern: execv(...)
      - pattern: execvp(...)
      - pattern: execvpe(...)
    message: "uso de system(), popen() ou exec*() detectado. essas funções podem permitir injeção de comandos se o input não for devidamente sanitizado. considerar alternativas mais seguras ou validar rigorosamente os parâmetros."
    languages:
      - c
      - cpp
    severity: ERROR
    metadata:
      owasp: "A03:2021 - Injection"
      cwe: "CWE-78"
      category: "command injection"

  - id: cpp-integer-overflow-risk
    pattern-either:
      - pattern: (int)$X
      - pattern: (short)$X
      - pattern: (char)$X
    message: "cast explícito de tipo inteiro detectado. conversões entre tipos de tamanhos diferentes podem causar truncamento ou overflow de inteiros. verificar se o valor de origem cabe no tipo de destino."
    languages:
      - c
      - cpp
    severity: INFO
    metadata:
      owasp: "A03:2021 - Injection"
      cwe: "CWE-190"
      category: "integer overflow"

  # ============================================================
  # regras customizadas para Go
  # foco em riscos comuns de segurança em aplicações Go
  # ============================================================

  - id: go-command-injection
    pattern-either:
      - pattern: exec.Command($CMD, ...)
      - pattern: exec.CommandContext($CTX, $CMD, ...)
    message: "uso de exec.Command detectado. se o comando ou seus argumentos vierem de input externo, isso pode permitir injeção de comandos. validar e sanitizar todos os parâmetros antes de executar."
    languages:
      - go
    severity: ERROR
    metadata:
      owasp: "A03:2021 - Injection"
      cwe: "CWE-78"
      category: "command injection"

  - id: go-ignored-error
    pattern-either:
      - pattern: |
          $X, _ = $FN(...)
      - pattern: |
          $X, _ := $FN(...)
    message: "erro ignorado detectado. em go, erros devem ser sempre tratados, especialmente em operações de segurança, I/O e rede. ignorar erros pode ocultar falhas críticas."
    languages:
      - go
    severity: WARNING
    metadata:
      owasp: "A09:2021 - Security Logging and Monitoring Failures"
      cwe: "CWE-754"
      category: "error handling"

  - id: go-weak-hash
    pattern-either:
      - pattern: md5.New()
      - pattern: md5.Sum(...)
      - pattern: sha1.New()
      - pattern: sha1.Sum(...)
    message: "algoritmo de hash fraco detectado (md5 ou sha1). para dados sensíveis como senhas ou tokens, utilizar sha256, sha512 ou bcrypt."
    languages:
      - go
    severity: ERROR
    metadata:
      owasp: "A02:2021 - Cryptographic Failures"
      cwe: "CWE-327"
      category: "cryptography"

  - id: go-sql-string-concat
    pattern-either:
      - pattern: |
          $DB.Query(fmt.Sprintf(...))
      - pattern: |
          $DB.Exec(fmt.Sprintf(...))
      - pattern: |
          $DB.QueryRow(fmt.Sprintf(...))
    message: "possível sql injection por concatenação de string em query. utilizar parâmetros ($1, $2 ou ?) e prepared statements em vez de fmt.Sprintf para construir queries."
    languages:
      - go
    severity: ERROR
    metadata:
      owasp: "A03:2021 - Injection"
      cwe: "CWE-89"
      category: "sql injection"
